[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ibb"
version = "0.1.0"
description = "Information-Borrowing Bayesian (IBB) covariance estimation for ultra-high-dimensional data, with HMC sampling"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "torch>=1.12",
    "scikit-learn>=1.0",
    "matplotlib>=3.5",
    "seaborn>=0.11",
]

[project.optional-dependencies]
# Only needed for the ROI -> Yeo network mapping and the glass-brain figures.
neuro = [
    "nibabel>=3.2",
    "nilearn>=0.9",
]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
